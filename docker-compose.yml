# Local development only. Deliberately mirrors the production cluster
# settings that cannot be changed after the fact, so that a problem shows up
# here rather than in staging.
#
#   docker compose up -d
#   PGHOST=localhost PGUSER=dev PGPASSWORD=dev PGDATABASE=registry ./db/migrate.sh
#
# Not production: no TLS, no replica, no WAL archiving, and the password is
# in this file. See README for what production requires.

services:
  postgres:
    image: postgres:16
    container_name: registry-pg
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: registry
      # Checksums can only be set at initdb. Production has them on, so this
      # does too, or local testing would not exercise the same code paths.
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=250ms
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d registry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
